<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Bot Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen py-10">

    <div id="app" class="text-center w-full max-w-lg px-4">
        <h1 class="text-3xl font-bold mb-4">Bot Control Panel</h1>
        <p class="text-gray-400 mb-6">Authenticating credentials...</p>
    </div>

    <script>
        const OWNER_ID = '1519986222745784351';
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1530232601108025476/ZkxzghTn7szHYPZuUSls8A6p4ftd52rrJ9njvzZTLI7EdwgVSMWgo2KTPrFQ6Oa0vf5G';

        const appDiv = document.getElementById('app');

        const fragment = new URLSearchParams(window.location.hash.slice(1));
        let accessToken = fragment.get('access_token') || localStorage.getItem('discord_access_token');

        if (fragment.get('access_token')) {
            localStorage.setItem('discord_access_token', accessToken);
            window.location.hash = ''; 
        }

        if (!accessToken) {
            window.location.href = 'index.html';
        } else {
            fetch('https://discord.com/api/users/@me', {
                headers: { authorization: `Bearer ${accessToken}` }
            })
            .then(res => res.json())
            .then(user => {
                if (user.id === OWNER_ID) {
                    renderDashboard(user);
                } else {
                    renderAccessDenied(user);
                }
            })
            .catch(() => {
                localStorage.removeItem('discord_access_token');
                appDiv.innerHTML = `
                    <div class="bg-gray-800 p-6 rounded-xl border border-red-500/50">
                        <p class="text-red-500 mb-4">Session expired or invalid token.</p>
                        <a href="index.html" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm font-bold">Back to Login</a>
                    </div>
                `;
            });
        }

        function logout() {
            localStorage.removeItem('discord_access_token');
            window.location.href = 'index.html';
        }

        function sendBotCommand(actionName) {
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    embeds: [{
                        title: "🎛️ Dashboard Command Executed",
                        description: `Owner triggered action: **${actionName}**`,
                        color: 5793266,
                        timestamp: new Date().toISOString()
                    }]
                })
            })
            .then(() => alert(`Command "${actionName}" sent!`))
            .catch(() => alert('Failed to send webhook request.'));
        }

        function sendCustomAnnouncement() {
            const title = document.getElementById('embed-title').value;
            const message = document.getElementById('embed-message').value;
            const colorHex = document.getElementById('embed-color').value;

            if (!title || !message) {
                alert('Please enter both a title and a message.');
                return;
            }

            const colorInt = parseInt(colorHex.replace('#', ''), 16);

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    embeds: [{
                        title: title,
                        description: message,
                        color: colorInt,
                        footer: { text: "Posted via Owner Dashboard" },
                        timestamp: new Date().toISOString()
                    }]
                })
            })
            .then(() => {
                alert('Announcement posted successfully!');
                document.getElementById('embed-title').value = '';
                document.getElementById('embed-message').value = '';
            })
            .catch(() => alert('Failed to post announcement.'));
        }

        function renderDashboard(user) {
            appDiv.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex items-center justify-between">
                        <div class="text-left">
                            <h1 class="text-xl font-bold text-green-400">Welcome, ${user.username}!</h1>
                            <p class="text-xs text-gray-400">Owner Access Authorized</p>
                        </div>
                        <button onclick="logout()" class="bg-gray-700 hover:bg-gray-600 text-xs px-3 py-1.5 rounded text-gray-300 font-semibold transition">
                            Log out
                        </button>
                    </div>

                    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 text-left">
                        <h2 class="text-lg font-bold mb-4 border-b border-gray-700 pb-2">Quick Controls</h2>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="sendBotCommand('Restart Bot')" class="bg-red-600 hover:bg-red-700 py-2 rounded font-bold transition text-sm">Restart Bot</button>
                            <button onclick="sendBotCommand('Clear Cache')" class="bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold transition text-sm">Clear Cache</button>
                        </div>
                    </div>

                    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 text-left space-y-4">
                        <h2 class="text-lg font-bold border-b border-gray-700 pb-2">Post Server Announcement</h2>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">TITLE</label>
                            <input id="embed-title" type="text" placeholder="e.g. Maintenance Update" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#5865F2]" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">MESSAGE CONTENT</label>
                            <textarea id="embed-message" rows="3" placeholder="Write message here..." class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#5865F2]"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">EMBED COLOR</label>
                            <input id="embed-color" type="color" value="#5865f2" class="h-10 w-full bg-gray-900 border border-gray-700 rounded cursor-pointer p-1" />
                        </div>
                        <button onclick="sendCustomAnnouncement()" class="bg-emerald-600 hover:bg-emerald-700 w-full py-2.5 rounded font-bold transition text-sm mt-2">
                            Send Announcement
                        </button>
                    </div>
                </div>
            `;
        }

        function renderAccessDenied(user) {
            appDiv.innerHTML = `
                <div class="bg-gray-800 p-8 rounded-xl border border-red-500/50">
                    <h1 class="text-2xl font-bold text-red-500 mb-2">Access Denied</h1>
                    <p class="text-gray-400 text-sm mb-4">Account ID (${user.id}) is not authorized.</p>
                    <button onclick="logout()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-xs font-bold">Try Another Account</button>
                </div>
            `;
        }
    </script>
</body>
</html>
