<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Dashboard - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Container -->
  <div class="w-full max-w-md bg-gray-800 rounded-xl p-8 shadow-2xl border border-gray-700 text-center">
    
    <div class="mb-6">
      <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-500/30">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold text-white mb-2">Bot Dashboard</h1>
      <p class="text-gray-400 text-sm">Secure owner-only management portal for your Discord bot.</p>
    </div>

    <!-- Login Button -->
    <a id="login-btn" href="#" class="block w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg transition-all duration-200 shadow-lg hover:shadow-indigo-500/25">
      Log in with Discord
    </a>

    <p class="text-xs text-gray-500 mt-6">
      Protected area. Only authorized bot owners can access controls.
    </p>

  </div>

  <script>
    // Configuration
    const CLIENT_ID = '1530226444037394526';
    const REDIRECT_URI = 'https://sd201826.github.io/Bot-dashboard/dashboard.html';

    // Generate OAuth2 Login Link
    const OAUTH_URL = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;

    // Attach Link to Button
    document.getElementById('login-btn').href = OAUTH_URL;
  </script>

</body>
</html>
