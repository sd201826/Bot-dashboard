<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Bot Dashboard - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

  <!-- Background Glow Effect -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none flex items-center justify-center">
    <div class="w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Container -->
  <div class="relative w-full max-w-md bg-slate-900/80 backdrop-blur-xl rounded-2xl p-8 shadow-2xl border border-slate-800 text-center">
    
    <div class="mb-6">
      <div class="w-16 h-16 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-indigo-500/20 shadow-inner">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight mb-2">Nexus Control</h1>
      <p class="text-slate-400 text-xs">Secure owner-only management portal for your Discord bot.</p>
    </div>

    <!-- Login Button -->
    <a id="login-btn" href="#" class="flex items-center justify-center w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition-all duration-200 shadow-lg shadow-indigo-600/30 text-xs">
      Log in with Discord
    </a>

    <p class="text-[11px] text-slate-500 mt-6">
      Protected area. Only authorized bot owners can access controls.
    </p>

  </div>

  <script>
    // Configuration
    const CLIENT_ID = '1530226444037394526';
    const REDIRECT_URI = 'https://sd201826.github.io/Bot-dashboard/dashboard.html';

    // Generate OAuth2 Login Link
    const OAUTH_URL = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;

    // Attach Link to Button
    document.getElementById('login-btn').href = OAUTH_URL;
  </script>

</body>
</html>
